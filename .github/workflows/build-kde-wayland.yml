777|           delete_stale_target_assets() {
778|             local target="$1"
779|             local desired="$2"
780|             local asset_rows asset_id asset_name
781|             asset_rows="$(gh api \
782|               "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
783|               --jq '.assets[] | [.id, .name] | @tsv')" || return 1
784|             while IFS=$'\t' read -r asset_id asset_name; do
785|               [ -n "$asset_id" ] || continue
786|               if asset_matches_target "$target" "$asset_name" && [ "$asset_name" != "$desired" ]; then
787|                 gh api --method DELETE \
788|                   "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
789|               fi
790|             done <<< "$asset_rows"
