1| name: 构建并发布 Anland KDE Wayland 软件包
2| run-name: Anland KDE 软件包 ${{ inputs.request_id || github.run_number }}
3| 
4| on:
5|   workflow_dispatch:
6|     inputs:
7|       build_target:
8|         description: 选择构建目标；all 中失败的平台沿用上一份完整 Release，单个平台只替换选中的包
9|         required: true
10|         type: choice
11|         default: all
12|         options:
13|           - all
14|           - ubuntu2604
15|           - ubuntu2404
16|           - Debian13
17|           - Fedora43
18|           - Fedora44
19|           - Arch
20|       anland_ref:
21|         description: 要构建的 Anland 分支、标签或提交
22|         required: true
23|         type: string
24|         default: main
25|       anland_repo:
26|         description: Anland 仓库地址
27|         required: true
28|         type: string
29|         default: https://github.com/superturtlee/anland.git
30|       request_id:
31|         description: 可选的调用方请求 ID
32|         required: false
33|         type: string
34|         default: ''
35| 
36| permissions:
37|   contents: write
38| 
39| concurrency:
40|   # 固定 Release 会被原地重写，必须串行更新。
41|   group: anland-kde-package-release
42|   cancel-in-progress: false
43| 
44| jobs:
45|   prepare:
46|     name: 解析 Anland 源码版本
47|     runs-on: ubuntu-latest
48|     outputs:
49|       anland_commit: ${{ steps.resolve.outputs.anland_commit }}
50|       targets: ${{ steps.targets.outputs.targets }}
51|     steps:
52|       - name: 生成构建矩阵
53|         id: targets
54|         env:
55|           BUILD_TARGET_INPUT: ${{ inputs.build_target }}
56|         shell: bash
57|         run: |
58|           set -euo pipefail
59| 
60|           case "$BUILD_TARGET_INPUT" in
61|             all)
62|               targets='["ubuntu2604","ubuntu2404","Debian13","Fedora43","Fedora44","Arch"]'
63|               ;;
64|             ubuntu2604|ubuntu2404|Debian13|Fedora43|Fedora44|Arch)
65|               targets="[\"$BUILD_TARGET_INPUT\"]"
66|               ;;
67|             *)
68|               echo "不支持的构建目标：$BUILD_TARGET_INPUT" >&2
69|               exit 1
70|               ;;
71|           esac
72| 
73|           echo "targets=$targets" >> "$GITHUB_OUTPUT"
74|           echo "构建目标：$targets"
75| 
76|       - name: 要求从 main 分支触发
77|         shell: bash
78|         run: |
79|           if [ "$GITHUB_REF_NAME" != main ]; then
80|             echo "此工作流必须从 main 分支触发。" >&2
81|             exit 1
82|           fi
83| 
84|       - name: 将请求的源解析为单个提交
85|         id: resolve
86|         env:
87|           ANLAND_REPO: ${{ inputs.anland_repo }}
88|           ANLAND_REF: ${{ inputs.anland_ref }}
89|         shell: bash
90|         run: |
91|           set -euo pipefail
92| 
93|           source_dir="$(mktemp -d)/anland"
94|           trap 'rm -rf "${source_dir%/anland}"' EXIT
95|           git init --quiet "$source_dir"
96|           git -C "$source_dir" remote add origin "$ANLAND_REPO"
97|           git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_REF"
98|           anland_commit="$(git -C "$source_dir" rev-parse FETCH_HEAD)"
99|           git -C "$source_dir" cat-file -e "${anland_commit}^{commit}"
100|           echo "anland_commit=$anland_commit" >> "$GITHUB_OUTPUT"
101|           echo "已将 $ANLAND_REPO @ $ANLAND_REF 解析为 $anland_commit"
102| 
103|   build:
104|     name: 构建 ${{ matrix.target }} 软件包
105|     needs: prepare
106|     runs-on: ubuntu-24.04-arm
107|     # 单个平台失败不阻止其余包和 Release 合并；Release 阶段会复用上一版该平台资产。
108|     continue-on-error: true
109|     strategy:
110|       fail-fast: false
111|       matrix:
112|         target: ${{ fromJson(needs.prepare.outputs.targets) }}
113| 
114|     env:
115|       ANLAND_REPO: ${{ inputs.anland_repo }}
116|       ANLAND_COMMIT: ${{ needs.prepare.outputs.anland_commit }}
117|       BUILD_TARGET: ${{ matrix.target }}
118| 
119|     steps:
120|       - name: 解析构建目标
121|         id: target
122|         shell: bash
123|         run: |
124|           set -euo pipefail
125| 
126|           case "$BUILD_TARGET" in
127|             ubuntu2604)
128|               image=ubuntu:26.04
129|               script=producers/kde/ubuntu2604_v5/build.sh
130|               package_pattern='*.deb'
131|               asset_prefix=anland-kde-ubuntu2604-kwin-
132|               asset_arch=arm64
133|               archive_target=ubuntu2604
134|               ;;
135|             ubuntu2404)
136|               image=ubuntu:24.04
137|               script=producers/kde/ubuntu2404_v5/build.sh
138|               package_pattern='*.deb'
139|               asset_prefix=anland-kde-ubuntu2404-kwin-
140|               asset_arch=arm64
141|               archive_target=ubuntu2404
142|               ;;
143|             Debian13)
144|               image=debian:trixie
145|               script=producers/kde/Debian13_v5/build.sh
146|               package_pattern='*.deb'
147|               asset_prefix=anland-kde-debian13-kwin-
148|               asset_arch=arm64
149|               archive_target=debian13
150|               ;;
151|             Fedora43)
152|               image=fedora:43
153|               script=producers/kde/Fedora43_v5/build.sh
154|               package_pattern='*.rpm'
155|               asset_prefix=anland-kde-fedora43-kwin-
156|               asset_arch=aarch64
157|               archive_target=fedora43
158|               ;;
159|             Fedora44)
160|               image=fedora:44
161|               # Fedora 44 使用 Fedora 43 的构建脚本，配 Fedora 44 基础镜像。
162|               script=producers/kde/Fedora43_v5/build.sh
163|               package_pattern='*.rpm'
164|               asset_prefix=anland-kde-fedora44-kwin-
165|               asset_arch=aarch64
166|               archive_target=fedora44
167|               ;;
168|             Arch)
169|               image=ogarcia/archlinux:latest
170|               script=producers/kde/Arch_v5/build.sh
171|               package_pattern='*.pkg.tar.*'
172|               asset_prefix=anland-kde-arch-kwin-
173|               asset_arch=aarch64
174|               archive_target=arch
175|               ;;
176|             *)
177|               echo "不支持的构建目标：$BUILD_TARGET" >&2
178|               exit 1
179|               ;;
180|           esac
181| 
182|           {
183|             echo "image=$image"
184|             echo "script=$script"
185|             echo "package_pattern=$package_pattern"
186|             echo "asset_prefix=$asset_prefix"
187|             echo "asset_arch=$asset_arch"
188|             echo "archive_target=$archive_target"
189|           } >> "$GITHUB_OUTPUT"
190| 
191|       - name: 在对应的发行版中构建软件包
192|         env:
193|           DISTRO_IMAGE: ${{ steps.target.outputs.image }}
194|           BUILD_SCRIPT: ${{ steps.target.outputs.script }}
195|           PKG_PATTERN: ${{ steps.target.outputs.package_pattern }}
196|           OUTPUT_DIR: .kde-package-build/${{ matrix.target }}
197|         shell: bash
198|         run: |
199|           set -euo pipefail
200| 
201|           rm -rf "$OUTPUT_DIR"
202|           mkdir -p "$OUTPUT_DIR"
203| 
204|           docker run --rm -i \
205|             --platform linux/arm64 \
206|             -e ANLAND_REPO \
207|             -e ANLAND_COMMIT \
208|             -e BUILD_SCRIPT \
209|             -e BUILD_TARGET \
210|             -e PKG_PATTERN \
211|             -v "$PWD/$OUTPUT_DIR:/root/kde-packages" \
212|             -v "$PWD/$OUTPUT_DIR:/tmp/kde-packages" \
213|             "$DISTRO_IMAGE" \
214|             bash -s <<'ANLAND_BUILD'
215|               set -euo pipefail
216| 
217|               case "$BUILD_TARGET" in
218|                 Debian13|ubuntu2604|ubuntu2404)
219|                   apt-get update
220|                   apt-get install -y --no-install-recommends \
221|                     git ca-certificates sudo \
222|                     build-essential devscripts dpkg-dev fakeroot patch
223|                   ;;
224|                 Fedora43|Fedora44)
225|                   dnf install -y --setopt=install_weak_deps=False \
226|                     git ca-certificates sudo \
227|                     dnf-plugins-core rpmdevtools rpm-build patch tar xz
228|                   ;;
229|                 Arch)
230|                   pacman -Syu --noconfirm
231|                   pacman -S --noconfirm --needed base-devel git ca-certificates sudo
232|                   useradd -m -s /bin/bash anland
233|                   printf "anland ALL=(root) NOPASSWD: /usr/bin/pacman\n" > /etc/sudoers.d/anland-pacman
234|                   chmod 0440 /etc/sudoers.d/anland-pacman
235|                   if grep -q "^#PACMAN_AUTH=()" /etc/makepkg.conf; then
236|                     sed -i "s/^#PACMAN_AUTH=().*/PACMAN_AUTH=(sudo)/" /etc/makepkg.conf
237|                   else
238|                     printf "\nPACMAN_AUTH=(sudo)\n" >> /etc/makepkg.conf
239|                   fi
240|                   chown -R anland:anland /tmp/kde-packages
241|                   ;;
242|               esac
243| 
244|               git init --quiet /tmp/anland
245|               git -C /tmp/anland remote add origin "$ANLAND_REPO"
246|               git -C /tmp/anland fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
247|               git -C /tmp/anland checkout --quiet --detach FETCH_HEAD
248| 
249|               # Debian 13 使用 DEB822 源；上游构建脚本要求 deb-src。
250|               if [ "$BUILD_TARGET" = Debian13 ] && [ -f /etc/apt/sources.list.d/debian.sources ]; then
251|                 sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/debian.sources
252|                 apt-get update
253|               fi
254| 
255|               test -f "/tmp/anland/$BUILD_SCRIPT"
256|               chmod +x "/tmp/anland/$BUILD_SCRIPT"
257| 
258|               if [ "$BUILD_TARGET" = Arch ]; then
259|                 su -s /bin/bash anland -c "cd /tmp/anland/$(dirname "$BUILD_SCRIPT") && WORKDIR=/tmp/kde-packages ./$(basename "$BUILD_SCRIPT") --noconfirm"
260|                 chmod -R a+rwX /tmp/kde-packages
261|               else
262|                 cd "/tmp/anland/$(dirname "$BUILD_SCRIPT")"
263|                 WORKDIR=/root/kde-packages sudo -E "./$(basename "$BUILD_SCRIPT")"
264|               fi
265| 
266|               # 从主 kwin 包读取上游版本；不要把发行版打包修订号放进资产名。
267|               kwin_package=""
268|               kwin_version=""
269|               case "$BUILD_TARGET" in
270|                 Debian13|ubuntu2604|ubuntu2404)
271|                   kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-wayland_*.deb' -print | sort | head -n1)"
272|                   if [ -z "$kwin_package" ]; then
273|                     kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-x11_*.deb' -print | sort | head -n1)"
274|                   fi
275|                   [ -n "$kwin_package" ] || { echo "未找到 kwin deb 包" >&2; exit 1; }
276|                   kwin_version="$(dpkg-deb -f "$kwin_package" Version)"
277|                   ;;
278|                 Fedora43|Fedora44)
279|                   kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-[0-9]*.rpm' -print | sort | head -n1)"
280|                   [ -n "$kwin_package" ] || { echo "未找到 kwin rpm 包" >&2; exit 1; }
281|                   kwin_version="$(rpm -qp --queryformat '%{VERSION}' "$kwin_package")"
282|                   ;;
283|                 Arch)
284|                   kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-[0-9]*.pkg.tar.*' -print | sort | head -n1)"
285|                   [ -n "$kwin_package" ] || { echo "未找到 kwin Arch 包" >&2; exit 1; }
286|                   kwin_version="$(pacman -Qp "$kwin_package" | awk 'NR == 1 { print $2 }')"
287|                   ;;
288|               esac
289|               # 去掉 epoch 和发行版/Arch 的 pkgrel，只保留 KWin 上游版本。
290|               kwin_version="${kwin_version#*:}"
291|               case "$BUILD_TARGET" in
292|                 Debian13|ubuntu2604|ubuntu2404|Arch) kwin_version="${kwin_version%-*}" ;;
293|               esac
294|               [ -n "$kwin_version" ] || { echo "无法解析 KWin 版本" >&2; exit 1; }
295|               printf '%s\n' "$kwin_version" > /tmp/kde-packages/.kwin-version
296|           ANLAND_BUILD
297| 
298|       - name: 打包 Release 资产
299|         id: package
300|         env:
301|           PKG_PATTERN: ${{ steps.target.outputs.package_pattern }}
302|           ASSET_PREFIX: ${{ steps.target.outputs.asset_prefix }}
303|           ASSET_ARCH: ${{ steps.target.outputs.asset_arch }}
304|           ARCHIVE_TARGET: ${{ steps.target.outputs.archive_target }}
305|           OUTPUT_DIR: .kde-package-build/${{ matrix.target }}
306|         shell: bash
307|         run: |
308|           set -euo pipefail
309| 
310|           package_dir="$RUNNER_TEMP/anland-kde-packages/$ARCHIVE_TARGET"
311|           asset_dir="$GITHUB_WORKSPACE/.release-assets/$BUILD_TARGET"
312|           rm -rf "$package_dir" "$asset_dir"
313|           mkdir -p "$package_dir" "$asset_dir"
314| 
315|           copy_packages() {
316|             local source_dir="$1"
317|             [ -d "$source_dir" ] || return 0
318|             find "$source_dir" -type f -name "$PKG_PATTERN" \
319|               ! -name '*debug*' ! -name '*dbgsym*' ! -name '*.src.*' \
320|               ! -name 'kwin-dev_*' ! -name 'kwin-devel-*' ! -name 'kwin-doc-*' \
321|               ! -name 'xorg-x11-server-Xwayland-devel-*' -exec cp -v {} "$package_dir/" \;
322|           }
323| 
324|           if [ "$BUILD_TARGET" = Arch ]; then
325|             copy_packages "$OUTPUT_DIR"
326|           else
327|             copy_packages "$OUTPUT_DIR/kwin"
328|             copy_packages "$OUTPUT_DIR/xwayland"
329|             copy_packages "$OUTPUT_DIR/xorg-x11-server-Xwayland"
330|           fi
331| 
332|           package_count="$(find "$package_dir" -maxdepth 1 -type f -name "$PKG_PATTERN" | wc -l)"
333|           if [ "$package_count" -eq 0 ]; then
334|             echo "未为 $BUILD_TARGET 收集到任何可安装的软件包" >&2
335|             exit 1
336|           fi
337| 
338|           kwin_version="$(tr -d '[:space:]' < "$OUTPUT_DIR/.kwin-version")"
339|           case "$kwin_version" in
340|             ''|*[!A-Za-z0-9.+~_-]*)
341|               echo "KWin 版本包含不支持用于文件名的字符：$kwin_version" >&2
342|               exit 1
343|               ;;
344|           esac
345|           asset_name="${ASSET_PREFIX}${kwin_version}-${ASSET_ARCH}.tar.gz"
346|           asset_path="$asset_dir/$asset_name"
347|           build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
348|           printf 'target=%s\nkwin_version=%s\nbuild_time=%s\n' \
349|             "$ARCHIVE_TARGET" "$kwin_version" "$build_time" > "$package_dir/.anland-kde-build-info"
350|           tar -C "$RUNNER_TEMP" -czf "$asset_path" "anland-kde-packages/$ARCHIVE_TARGET"
351|           echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"
352|           echo "已将 $package_count 个文件打包进 $asset_name（构建时间：$build_time）"
353| 
354|       - name: 上传 Release 资产
355|         uses: actions/upload-artifact@v6
356|         with:
357|           name: anland-kde-package-${{ matrix.target }}
358|           path: ${{ steps.package.outputs.asset_path }}
359|           if-no-files-found: error
360|           retention-days: 1
361| 
362|   release:
363|     name: 更新 Anland KDE 滚动 Release
364|     needs: [prepare, build]
365|     if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
366|     runs-on: ubuntu-latest
367|     steps:
368|       - name: 检出安装脚本
369|         uses: actions/checkout@v5
370|         with:
371|           ref: ${{ github.sha }}
372| 
373|       - name: 下载软件包资产
374|         if: ${{ always() }}
375|         uses: actions/download-artifact@v7
376|         with:
377|           pattern: anland-kde-package-*
378|           path: release-assets
379|           merge-multiple: true
380| 
381|       - name: 创建固定 Release 与软件包清单
382|         env:
383|           GH_TOKEN: ${{ github.token }}
384|           ANLAND_REPO: ${{ inputs.anland_repo }}
385|           ANLAND_REF: ${{ inputs.anland_ref }}
386|           ANLAND_COMMIT: ${{ needs.prepare.outputs.anland_commit }}
387|           REQUEST_ID: ${{ inputs.request_id }}
388|           BUILD_TARGET_INPUT: ${{ inputs.build_target }}
389|         shell: bash
390|         run: |
391|           set -euo pipefail
392| 
393|           release_dir="$GITHUB_WORKSPACE/release-assets"
394|           mkdir -p "$release_dir"
395|           rolling_release_tag="anland-kde-packages"
396|           release_targets=(Arch Debian13 ubuntu2604 ubuntu2404 Fedora43 Fedora44)
397|           declare -A asset_by_target=()
398|           declare -A asset_time_by_target=()
399|           declare -A asset_source_by_target=()
400|           updated_targets=()
401|           reused_targets=()
402|           build_time="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
403| 
404|           asset_prefix_for_target() {
405|             case "$1" in
406|               Arch) printf '%s\n' 'anland-kde-arch-kwin-' ;;
407|               Debian13) printf '%s\n' 'anland-kde-debian13-kwin-' ;;
408|               ubuntu2604) printf '%s\n' 'anland-kde-ubuntu2604-kwin-' ;;
409|               ubuntu2404) printf '%s\n' 'anland-kde-ubuntu2404-kwin-' ;;
410|               Fedora43) printf '%s\n' 'anland-kde-fedora43-kwin-' ;;
411|               Fedora44) printf '%s\n' 'anland-kde-fedora44-kwin-' ;;
412|               *) echo "不支持的构建目标：$1" >&2; return 1 ;;
413|             esac
414|           }
415| 
416|           target_label() {
417|             case "$1" in
418|               Arch) printf '%s\n' 'Arch Linux' ;;
419|               Debian13) printf '%s\n' 'Debian 13' ;;
420|               ubuntu2604) printf '%s\n' 'Ubuntu 26.04' ;;
421|               ubuntu2404) printf '%s\n' 'Ubuntu 24.04' ;;
422|               Fedora43) printf '%s\n' 'Fedora 43' ;;
423|               Fedora44) printf '%s\n' 'Fedora 44' ;;
424|               *) echo "不支持的构建目标：$1" >&2; return 1 ;;
425|             esac
426|           }
427| 
428|           asset_arch_for_target() {
429|             case "$1" in
430|               Arch|Fedora43|Fedora44) printf '%s\n' 'aarch64' ;;
431|               Debian13|ubuntu2604|ubuntu2404) printf '%s\n' 'arm64' ;;
432|               *) echo "不支持的构建目标：$1" >&2; return 1 ;;
433|             esac
434|           }
435| 
436|           archive_target_for_target() {
437|             case "$1" in
438|               Arch) printf '%s\n' 'arch' ;;
439|               Debian13) printf '%s\n' 'debian13' ;;
440|               ubuntu2604) printf '%s\n' 'ubuntu2604' ;;
441|               ubuntu2404) printf '%s\n' 'ubuntu2404' ;;
442|               Fedora43) printf '%s\n' 'fedora43' ;;
443|               Fedora44) printf '%s\n' 'fedora44' ;;
444|               *) echo "不支持的构建目标：$1" >&2; return 1 ;;
445|             esac
446|           }
447| 
448|           local_asset_for_target() {
449|             local target="$1"
450|             local prefix arch
451|             local path
452|             local -a candidates=()
453|             prefix="$(asset_prefix_for_target "$target")"
454|             arch="$(asset_arch_for_target "$target")"
455|             while IFS= read -r path; do
456|               candidates+=("${path##*/}")
457|             done < <(find "$release_dir" -maxdepth 1 -type f -name "${prefix}*-${arch}.tar.gz" -print | sort)
458|             if [ "${#candidates[@]}" -gt 1 ]; then
459|               echo "资产前缀 ${prefix} 在本次构建中应匹配一个文件，实际为 ${#candidates[@]} 个。" >&2
460|               return 2
461|             elif [ "${#candidates[@]}" -eq 0 ]; then
462|               return 1
463|             fi
464|             printf '%s\n' "${candidates[0]}"
465|           }
466| 
467|           release_assets_tag=""
468|           release_assets=""
469|           load_release_assets() {
470|             local tag="$1"
471|             if [ "$release_assets_tag" = "$tag" ]; then
472|               return 0
473|             fi
474|             if ! release_assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[].name')"; then
475|               return 1
476|             fi
477|             release_assets_tag="$tag"
478|           }
479| 
480|           release_asset_for_target() {
481|             local tag="$1"
482|             local target="$2"
483|             local prefix arch name
484|             local -a candidates=()
485|             prefix="$(asset_prefix_for_target "$target")"
486|             arch="$(asset_arch_for_target "$target")"
487|             load_release_assets "$tag" || return 1
488|             while IFS= read -r name; do
489|               case "$name" in
490|                 "${prefix}"*"-${arch}.tar.gz") candidates+=("$name") ;;
491|               esac
492|             done <<< "$release_assets"
493|             if [ "${#candidates[@]}" -gt 1 ]; then
494|               echo "Release ${tag} 中资产前缀 ${prefix} 应匹配一个文件，实际为 ${#candidates[@]} 个。" >&2
495|               return 2
496|             elif [ "${#candidates[@]}" -eq 1 ]; then
497|               printf '%s\n' "${candidates[0]}"
498|               return 0
499|             fi
500|             return 1
501|           }
502| 
503|           archive_build_time() {
504|             local archive="$1"
505|             local target="$2"
506|             local archive_target metadata build_timestamp
507|             archive_target="$(archive_target_for_target "$target")"
508|             if ! metadata="$(tar -xOzf "$archive" "anland-kde-packages/$archive_target/.anland-kde-build-info" 2>/dev/null)"; then
509|               return 1
510|             fi
511|             build_timestamp="$(printf '%s\n' "$metadata" | sed -n 's/^build_time=//p' | sed -n '1p')"
512|             [ -n "$build_timestamp" ] || return 1
513|             printf '%s\n' "$build_timestamp"
514|           }
515| 
516|           previous_tag=""
517|           previous_release_time=""
518|           # 固定 Release 有几个平台就能沿用几个；第一次构建时它还不存在，返回 1 即可。
519|           find_previous_release() {
520|             local stable_candidate
521| 
522|             stable_candidate="$(gh api \
523|               "repos/$GITHUB_REPOSITORY/releases/tags/$rolling_release_tag" \
524|               --jq 'select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null)" || return 1
525|             [ "$stable_candidate" = "$rolling_release_tag" ] || return 1
526|             release_assets_tag=""
527|             load_release_assets "$rolling_release_tag" || return 1
528|             previous_tag="$rolling_release_tag"
529|             previous_release_time="$(gh api \
530|               "repos/$GITHUB_REPOSITORY/releases/tags/$rolling_release_tag" \
531|               --jq '.published_at // empty')" || return 1
532|             return 0
533|           }
534| 
535|           case "$BUILD_TARGET_INPUT" in
536|             all)
537|               selected_prefix=""
538|               ;;
