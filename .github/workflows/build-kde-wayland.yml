806|           restore_rollback_assets() {
807|             local rollback_asset rollback_name current_rows current_id current_name
808| 
809|             # Restore packages and the installer first. The old manifest is uploaded
810|             # last, so it never points at an asset that has not been restored yet.
811|             for rollback_asset in "$rollback_dir"/*; do
812|               rollback_name="${rollback_asset##*/}"
813|               [ "$rollback_name" = 'anland-kde-manifest' ] && continue
814|               gh release upload "$release_tag" "$rollback_asset" \
815|                 --repo "$GITHUB_REPOSITORY" \
816|                 --clobber || echo "恢复资产失败：$rollback_name" >&2
817|             done
818|             if [ -f "$rollback_dir/anland-kde-manifest" ]; then
819|               gh release upload "$release_tag" "$rollback_dir/anland-kde-manifest" \
820|                 --repo "$GITHUB_REPOSITORY" \
821|                 --clobber || echo '恢复软件包清单失败。' >&2
822|             fi
823| 
824|             # Removing extras is best effort. A failed deletion only leaves an
825|             # unreferenced asset; it must never make the prior Release unavailable.
826|             current_rows="$(gh api \
827|               "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
828|               --jq '.assets[] | [.id, .name] | @tsv')" || return 0
829|             while IFS=$'\t' read -r current_id current_name; do
830|               [ -n "$current_id" ] || continue
831|               if [ ! -f "$rollback_dir/$current_name" ]; then
832|                 gh api --method DELETE \
833|                   "repos/$GITHUB_REPOSITORY/releases/assets/$current_id" || \
834|                   echo "未能删除恢复后的多余资产：$current_name" >&2
835|               fi
836|             done <<< "$current_rows"
837|           }
